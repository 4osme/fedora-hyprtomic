name: lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck lua5.4 python3-yaml

      - name: Run repository checks
        run: bash scripts/check.sh
