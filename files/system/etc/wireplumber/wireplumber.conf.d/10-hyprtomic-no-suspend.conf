# Keep hardware sinks running. Suspending an output (Sunshine's virtual sink,
# a Bluetooth headset or a USB DAC going idle) was the source of dropped audio
# and of the old shell's default-sink-destroy crash.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
