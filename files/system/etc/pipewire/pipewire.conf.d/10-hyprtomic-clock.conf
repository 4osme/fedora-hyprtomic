# Follow the source rate instead of resampling everything to 48 kHz, with a
# stable 2048-sample quantum (ported from nixos-dotfiles system/audio.nix).
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 96000 ]
    default.clock.quantum       = 2048
    default.clock.min-quantum   = 512
    default.clock.max-quantum   = 2048
}
